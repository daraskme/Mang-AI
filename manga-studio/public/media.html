<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mang-AI · 修正とモザイク</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./media.css"></head>
<body><header class="topbar"><a class="brand" href="#">M<span>✦</span>NG-AI <small>IMAGE EDITOR</small></a><div class="top-actions"><button id="before">元の画像と比較</button><button id="download">結果を保存 ↓</button><button id="commit" class="accent">コマに反映</button></div></header>
<div class="media-workspace"><main class="media-main"><div class="media-heading"><span class="eyebrow">RETOUCH & MOSAIC</span><h1>修正とモザイク</h1><p id="dimensions" class="muted">読み込み中</p></div><div class="media-stage"><div id="surface"><canvas id="picture"></canvas><canvas id="mask" aria-label="修正範囲を描くキャンバス"></canvas></div></div><div id="videoControls" hidden><button id="play">再生</button><input id="timeline" type="range" min="0" step="0.01" value="0"><span id="timeLabel">0.00秒</span></div><p id="status" role="status">編集データを読み込んでいます</p><video id="video" hidden preload="metadata"></video></main>
<aside class="media-inspector"><h2>範囲を指定</h2><p class="muted">塗った範囲だけを処理します。元ファイルは残ります。</p><label>操作<select id="tool"><option value="brush">ブラシ</option><option value="rectangle">矩形</option><option value="eraser">消しゴム</option></select></label><label>ブラシサイズ <span id="brushLabel">32 px</span><input id="brush" type="range" min="4" max="200" value="32"></label><div class="button-row"><button id="undoMask">描画を戻す</button><button id="clear">範囲を消す</button></div>
<div class="edit-section"><h2>IOPaint 修正</h2><p class="muted">選択範囲を周囲になじむよう補完します。</p><button id="inpaint" class="save-button">選択範囲を修正</button></div>
<div class="edit-section"><h2>モザイク</h2><label>ブロックの大きさ<input id="block" type="number" min="0" max="512" value="0"><small>0 は画像サイズに合わせて自動設定</small></label><div id="videoRange" hidden><label>開始秒<input id="startSeconds" type="number" min="0" step="0.1" value="0"></label><label>終了秒<input id="endSeconds" type="number" min="0" step="0.1"></label><small>手描き範囲は指定時間の同じ位置に適用。自動処理では対象を追跡します。</small></div><button id="mosaic" class="save-button">選択範囲にモザイク</button>
<details open><summary>自動検出</summary><div class="check-options"><label><input type="checkbox" name="category" value="penis" checked>男性器</label><label><input type="checkbox" name="category" value="vagina" checked>女性器</label><label><input type="checkbox" name="category" value="nipples">乳首</label><label><input type="checkbox" name="category" value="mosaic">既存モザイク</label></div><label>検出しきい値<input id="threshold" type="number" min="0.05" max="1" step="0.05" value="0.3"></label><label class="check-label"><input id="refine" type="checkbox">SAM2で輪郭を補正</label><div class="button-row"><button id="detect">範囲を自動選択</button><button id="autoMosaic">自動でモザイク</button></div><p class="muted">検出結果は確認して、ブラシで追加・削除できます。</p></details></div>
<div class="edit-section"><h2>編集履歴</h2><select id="versions" aria-label="編集版"></select><button id="restore">この版に戻す</button><button id="cancel" class="quiet" hidden>処理を中止</button></div></aside></div>
<script type="module" src="./media.js"></script></body></html>
