<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作スペース · Mang-AI</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./progress.css"><link rel="stylesheet" href="./workspace.css"></head>
<body><header><strong id="workspace-title">制作スペース</strong><nav aria-label="制作スペースの表示" role="tablist"><button id="tab-gallery" role="tab" aria-controls="gallery-frame" aria-selected="true" data-view="gallery" aria-pressed="true">ギャラリー</button><button id="tab-generate" role="tab" aria-controls="generate-frame" aria-selected="false" tabindex="-1" data-view="generate" aria-pressed="false">生成</button><button id="tab-models" role="tab" aria-controls="models-frame" aria-selected="false" tabindex="-1" data-view="models" aria-pressed="false">モデル・LoRA</button><button id="tab-editor" role="tab" aria-controls="editor-frame" aria-selected="false" tabindex="-1" data-view="editor" aria-pressed="false">編集</button></nav><p id="workspace-status" role="status"></p></header>
<iframe id="workspace-quota" title="担当AIの残り使用量" hidden></iframe>
<section id="workspace-progress" aria-label="このセッションの制作進捗" tabindex="-1"></section>
<main><iframe id="gallery-frame" title="メディアギャラリー"></iframe><iframe id="generate-frame" title="画像・動画の生成" hidden></iframe><iframe id="models-frame" title="モデル・LoRA一覧" hidden></iframe><iframe id="editor-frame" title="漫画・画像の編集" hidden></iframe><p id="editor-empty" hidden>メディアを選んで「編集を開く」を押してください。漫画が作成済みなら、このセッションの編集画面を開きます。</p></main>
<script type="module" src="./workspace.js"></script></body></html>
