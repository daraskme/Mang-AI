<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mang-AI 生成スタジオ</title>
<link rel="stylesheet" href="./media.css"><link rel="stylesheet" href="./embedded.css"></head><body><h1>Mang-AI 生成スタジオ</h1><p>画像・動画を生成し、このセッションの履歴へ保存します。</p><p id="status" role="status"></p><section id="generation-progress" hidden aria-label="生成の全体進捗"><div><strong id="generation-detail"></strong> <span id="generation-eta"></span></div><progress id="generation-bar" max="100" value="0" style="width:100%" aria-label="全体の生成進捗"></progress><small id="generation-percent">全体 0%</small></section><main><section><h2>生成設定</h2>
<label for="provider">生成環境</label><select id="provider"><option value="krea">Krea 2 · 画像</option><option value="h3">MiniMax H3 · 動画</option><option value="longvideo">H3 LongVideos · 長尺動画</option></select>
<div class="button-row"><button id="start">環境を起動</button><button id="refresh">モデル一覧を更新</button><button id="stop">待機中の環境を停止</button></div>
<label for="model">モデル</label><select id="model"><option value="">環境を起動して一覧を更新</option></select>
<label for="loras">LoRA（複数選択可）</label><select id="loras" multiple size="4"></select><label for="lora-weight">選択したLoRAの強度</label><input id="lora-weight" type="number" min="-4" max="4" step="0.1" value="0.8"><small>最終学習モデルを一覧に表示します。中間版は学習履歴に保存しています。</small>
<label for="project-title">動画作品名（ショット・修正版をまとめる）</label><input id="project-title" placeholder="例：雨上がりの帰り道"><label for="prompt">生成指示</label><textarea id="prompt" placeholder="描きたい場面を入力してください。長尺動画は最初の段落が共通設定、空行で区切った次の段落から1段落1ショットです。"></textarea>
<div class="row"><div><label for="quality">速度と品質</label><select id="quality"><option value="balanced">標準 · 8ステップ</option><option value="draft">確認用 · 4ステップ</option></select></div><div><label for="seed">シード</label><input id="seed" type="number" min="0" value="42"></div></div>
<div id="short"><div class="row"><div><label for="width">幅</label><input id="width" type="number" step="16" value="1024"></div><div><label for="height">高さ</label><input id="height" type="number" step="16" value="1024"></div></div><label for="frames">動画フレーム数（24fps）</label><input id="frames" type="number" value="124"></div>
<div id="long" hidden><div class="row"><div><label for="shot">1ショットの秒数</label><input id="shot" type="number" min="1" max="15" step="0.5" value="8"></div><div><label for="mp">解像度</label><select id="mp"><option value="0.4">0.4MP · 確認用</option><option value="0.8">0.8MP · 標準</option><option value="1">1MP · 高精細</option></select></div></div><label for="ratio">縦横比</label><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option></select><label for="latent">潜在アップスケール</label><select id="latent"><option value="off">使用しない</option></select><small>合計120秒以内。台詞は二重引用符で指定し、環境音は各ショットに書いてください。</small></div>
<label for="first">先頭画像の絶対パス（動画・任意）</label><input id="first" placeholder="/mnt/solidigm-b/Mang-AI/…/image.png">
<button id="plan">長尺の構成を確認</button><button id="submit">生成を開始</button>
</section><section><h2>結果と履歴</h2><pre id="result">生成前です。</pre><p id="output"></p><button id="cancel" disabled>選択中の生成を中止</button><h3>Hires・アップスケール</h3><small>Kreaは1.5倍・4ステップ・denoise 0.25。H3はLanczos 2倍で音声を維持。長尺は生成前に潜在拡大を選べます。</small><button id="upscale" disabled>選択中の結果を高解像度化</button><h3>このセッションの履歴</h3><div id="history"></div><h3>学習用データセット</h3><button id="library">保存済みデータセットを表示</button><div id="datasets"></div></section></main><script type="module" src="./generate.js"></script></body></html>
